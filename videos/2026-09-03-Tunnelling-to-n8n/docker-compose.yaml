services:
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "127.0.0.1:5678:5678"
    env_file: .env
    volumes:
      - n8n_data:/home/node/.n8n

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    depends_on:
      - n8n
    env_file: .env
    command: http --url=${NGROK_DOMAIN} n8n:5678
    ports:
      - "127.0.0.1:4040:4040"   # ngrok inspector

volumes:
  n8n_data:
    # Uncomment the next two liines to use your existing n8n data volume
    # external: true
    # name: n8n_data
